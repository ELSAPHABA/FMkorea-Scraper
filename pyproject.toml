[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fmkorea-scraper"
version = "0.1.0"
description = "FMKorea scraper core contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4,<5",
  "pydantic>=2,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "beautifulsoup4>=4,<5",
]

[project.optional-dependencies]
s3 = [
  "boto3>=1.34,<2",
]
postgres = [
  "psycopg[binary]>=3,<4",
]
mcp = [
  "mcp>=1,<2",
]
analysis = [
  "polars>=1,<2",
]
test = [
  "hypothesis>=6,<7",
  "pytest>=8,<9",
]

[project.scripts]
fmkorea-scraper = "fmkorea_scraper.adapters.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "benchmark_smoke: optional model validation/serialization timing smoke tests",
  "docker: optional Docker smoke tests",
  "garage: optional Garage/S3-compatible smoke tests",
  "postgres: optional PostgreSQL smoke tests",
  "mcp: optional MCP smoke tests",
  "live: optional live network smoke tests",
  "live_smoke: optional live HTTP smoke tests",
  "polars_smoke: optional Polars JSONL readability smoke tests",
  "s3_smoke: optional S3-compatible object storage smoke tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fmkorea_scraper"]
