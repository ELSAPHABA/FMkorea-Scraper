[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fmkorea-scraper"
version = "0.1.0"
description = "FMKorea scraper core contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2,<3",
]

[project.optional-dependencies]
s3 = [
  "boto3>=1.34,<2",
]
postgres = [
  "psycopg[binary]>=3,<4",
]
mcp = [
  "mcp>=1,<2",
]
analysis = [
  "polars>=1,<2",
]
test = [
  "hypothesis>=6,<7",
  "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "benchmark_smoke: optional model validation/serialization timing smoke tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fmkorea_scraper"]
